<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><title>Узел крепления перемычки</title><rect width="1400" height="990" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#233e32}.small{font-size:18px;fill:#68766e}.label{font-size:22px;font-weight:bold}.leader{fill:none;stroke:#72917b;stroke-width:2}</style><text x="60" y="60" font-size="21" font-weight="bold">ЦЕНТРСПЕЦМЕТАЛЛ</text><text x="60" y="110" font-size="32" font-weight="bold">Узел 01 · Перемычка под сиденьем · Узор</text><text x="1340" y="60" text-anchor="end" class="small">РЕД. 02 · СХЕМА ДЛЯ СОГЛАСОВАНИЯ</text><text x="60" y="158" class="small">Увеличенный вид спереди. Показана правая сторона; левая собирается зеркально.</text><rect x="120.0" y="230.0" width="1015.0" height="112.0" fill="#eee1ce" stroke="#344b3d" stroke-width="1.5"/><rect x="120.0" y="503.0" width="602.0" height="7.0" fill="#6e7f73" stroke="#344b3d" stroke-width="1.5"/><rect x="120.0" y="370.0" width="602.0" height="7.0" fill="#6e7f73" stroke="#344b3d" stroke-width="1.5"/><rect x="120.0" y="377.0" width="602.0" height="126.0" fill="#6e7f73" stroke="#344b3d" stroke-width="1.5"/><rect x="120.0" y="377.0" width="602.0" height="126.0" fill="#6e7f73" stroke="#344b3d" stroke-width="1.5"/><rect x="722.0" y="356.0" width="21.0" height="168.0" fill="#c9d7cb" stroke="#344b3d" stroke-width="1.5"/><rect x="743.0" y="342.0" width="154.0" height="140.0" fill="#a4b5a7" stroke="#344b3d" stroke-width="1.5"/><rect x="687.0" y="389.3" width="28.0" height="45.5" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="715.0" y="380.5" width="7.0" height="63.0" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="897.0" y="380.5" width="7.0" height="63.0" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="904.0" y="389.3" width="28.0" height="45.5" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="687.0" y="389.3" width="28.0" height="45.5" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="715.0" y="380.5" width="7.0" height="63.0" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="897.0" y="380.5" width="7.0" height="63.0" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><rect x="904.0" y="389.3" width="28.0" height="45.5" fill="#87918a" stroke="#344b3d" stroke-width="1.5"/><path d="M645.0 412.0H977.5" stroke="#5e7564" stroke-width="1.5" stroke-dasharray="9 5"/><text x="150" y="675" class="label">01 · Продольная перемычка</text><path class="leader" d="M340 645V530L540.0 440.0"/><text x="620" y="735" class="label">02 · Торцевая пластина</text><path class="leader" d="M740 705V600L732.5 475.0"/><text x="1040" y="575" class="label">03 · Литая боковина</text><path class="leader" d="M1040 548H960L837.5 440.0"/><text x="60" y="245" class="label">Деревянный настил</text><path class="leader" d="M300 250L417.5 265.0"/><text x="1020" y="305" class="label">Крепёж</text><path class="leader" d="M1020 325H980L918.0 412.0"/><text x="60" y="805" class="small">Перемычка заканчивается у пластины. Пластина прилегает к внутренней грани верхней части боковины.</text><text x="60" y="842" class="small">Болты, шайбы и гайки показаны условно. Отверстия, посадки, сечения и крепёж назначаются в рабочем проекте.</text><path d="M60 885H1340" stroke="#cbd6ce"/><text x="60" y="925" class="small">Геометрическая сборочная схема для согласования. Расчёт прочности и литейная документация не выполнены.</text><text x="60" y="960" class="small">Тула · ЦЕНТРСПЕЦМЕТАЛЛ · csm-factory@bk.ru</text></svg>