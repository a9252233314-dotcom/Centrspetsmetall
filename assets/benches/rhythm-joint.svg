#ebd5b7" stroke="#355240" stroke-width="1.4"/><text x="60" y="230" class="label">01 · Профилированное деревянное ребро</text><path d="M510 240 570 285 700 310" fill="none" stroke="#73907c" stroke-width="2"/><text x="60" y="705" class="label">02 · Две продольные стальные балки</text><path d="M425 670V565L380 485" fill="none" stroke="#73907c" stroke-width="2"/><text x="790" y="705" class="label">03 · Верхняя площадка боковины</text><path d="M960 670V615L900 570" fill="none" stroke="#73907c" stroke-width="2"/><text x="60" y="790" class="small">Ребро опирается на две балки. Каждая балка опирается на обе чугунные боковины.</text><text x="60" y="830" class="small">Базовый вариант: 21 ребро. На странице можно сравнить 25 и 29 рёбер; рабочий крепёж не назначен.</text><path d="M60 880H1340" stroke="#cbd6ce"/><text x="60" y="920" class="small">Конструктивная схема для обсуждения. Прочность, крепления и изготовление деревянных рёбер требуют проработки.</text><text x="60" y="960" class="small">Тула · Тульская литейная мануфактура · csm-factory@bk.ru</text></svg>