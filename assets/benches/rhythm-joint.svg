<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><title>Схема параметрического настила</title><rect width="1400" height="990" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#233e32}.small{font-size:18px;fill:#68766e}.label{font-size:23px;font-weight:bold}</style><text x="60" y="60" font-size="21" font-weight="bold">Тульская литейная мануфактура</text><text x="60" y="112" font-size="34" font-weight="bold">Ритм · Схема опирания параметрического настила</text><text x="60" y="157" class="small">Вид с торца. Ребро и опора из соседних сечений показаны условно на одном виде.</text><polygon points="337.9,530.0 424.1,530.0 425.0,529.1 425.0,526.5 424.1,525.6 337.9,525.6 337.0,526.5 337.0,529.1" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="337.9,446.4 424.1,446.4 425.0,445.5 425.0,442.9 424.1,442.0 337.9,442.0 337.0,442.9 337.0,445.5" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="337.9,525.6 340.5,525.6 341.4,524.7 341.4,447.3 340.5,446.4 337.9,446.4 337.0,447.3 337.0,524.7" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="421.5,525.6 424.1,525.6 425.0,524.7 425.0,447.3 424.1,446.4 421.5,446.4 420.6,447.3 420.6,524.7" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="975.9,530.0 1062.1,530.0 1063.0,529.1 1063.0,526.5 1062.1,525.6 975.9,525.6 975.0,526.5 975.0,529.1" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="975.9,446.4 1062.1,446.4 1063.0,445.5 1063.0,442.9 1062.1,442.0 975.9,442.0 975.0,442.9 975.0,445.5" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="975.9,525.6 978.5,525.6 979.4,524.7 979.4,447.3 978.5,446.4 975.9,446.4 975.0,447.3 975.0,524.7" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="1059.5,525.6 1062.1,525.6 1063.0,524.7 1063.0,447.3 1062.1,446.4 1059.5,446.4 1058.6,447.3 1058.6,524.7" fill="#a8b8ad" stroke="#355240" stroke-width="1.4"/><polygon points="610.9