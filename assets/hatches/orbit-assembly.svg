<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><title>Орбита — assembly.svg</title><rect width="1400" height="990" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#233e32}.small{font-size:17px;fill:#65756a}.label{font-size:22px;font-weight:bold}.measure{fill:none;stroke:#789283;stroke-width:1.3}</style><text x="55" y="52" font-size="20" font-weight="bold">ЦЕНТРСПЕЦМЕТАЛЛ</text><text x="55" y="98" font-size="30" font-weight="bold">Как крышка «Орбита» опирается на раму</text><text x="1345" y="52" text-anchor="end" class="small">ЦСМ ЛК-01 · ЭСКИЗ ДЛЯ СОГЛАСОВАНИЯ</text><text x="55" y="148" class="small">Схема разреза через центр вне гнёзд. Рельеф условно опущен; опорная геометрия показана отдельно.</text><polygon points="140.0,500 280.0,500 280.0,464 140.0,464" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="1120.0,500 1260.0,500 1260.0,464 1120.0,464" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="232.40000000000003,464 280.0,464 280.0,380 232.40000000000003,380" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="1120.0,464 1167.6,464 1167.6,380 1120.0,380" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="189.00000000000006,464 232.40000000000003,464 232.40000000000003,320 189.00000000000006,320" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="1167.6,464 1211.0,464 1211.0,320 1167.6,320" fill="#b7c9bd" stroke="#314e3b" stroke-width="1.5"/><polygon points="238.00000000000006,380 1162.0,380 1162.0,328 238.00000000000006,328" fill="#567561" stroke="#314e3b" stroke-width="1.5"/><polygon points="296.8,448 1103.2,448 1103.2,380 296.8,380" fill="#567561" stroke="#314e3b" stroke-width="1.5"/><text x="70" y="260" class="label">01 · Литая рама</text><path d="M240 275V305L203.00000000000006 360" fill="none" stroke="#789283" stroke-width="2"/><text x="490" y="220" class="label">02 · Съёмная крышка</text><path d="M690 235V280L700.0 350" fill="none" stroke="#789283" stroke-width="2"/><text x="910" y="590" class="label">03 · Полка рамы</text><path d="M1030 565V520L1141.0 380" fill="none" stroke="#789283" stroke-width="2"/><text x="55" y="625" class="label">Опирание по периметру</text><text x="55" y="663" class="small">Край крышки находится на полке рамы. Нижние рёбра расположены внутри свободного проёма.</text><text x="55" y="699" class="small">В эскизе: зона опирания 30 мм, боковой зазор 4 мм. Это предложения, не производственные допуски.</text><text x="55" y="752" class="label">Что определяется в рабочем проекте</text><text x="55" y="789" class="small">Сечения и посадки, отсутствие качания, удержание крышки, способ снятия и монтаж рамы.</text><text x="55" y="826" class="small">Уплотнение, запирание и шарнир не показаны и не входят в заявленную комплектацию эскиза.</text><path d="M55 868H1345" stroke="#cbd6ce"/><text x="55" y="908" class="small">Геометрическая схема для обсуждения. Допустимая нагрузка и результаты испытаний не заявлены.</text><text x="55" y="949" class="small">Тула · ЦЕНТРСПЕЦМЕТАЛЛ · csm-factory@bk.ru</text></svg>